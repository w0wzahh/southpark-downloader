name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  windows:
    name: Windows release
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest pyinstaller

      - name: Run tests
        run: python -m pytest -q

      - name: Build portable application
        shell: pwsh
        run: python -m PyInstaller --clean --noconfirm packaging\SouthParkDownloader.spec

      - name: Build installer
        shell: pwsh
        run: |
          $iscc = @(
            "$env:ProgramFiles(x86)\Inno Setup 6\ISCC.exe",
            "$env:ProgramFiles\Inno Setup 6\ISCC.exe"
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) { throw "Inno Setup 6 was not found on the runner." }
          & $iscc packaging\SouthParkDownloader.iss

      - name: Zip portable build
        shell: pwsh
        run: Compress-Archive -Path dist\SouthParkDownloader\* -DestinationPath dist\SouthParkDownloader-${{ github.ref_name }}-portable.zip

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: southpark-downloader-windows
          path: |
            dist/SouthParkDownloader-${{ github.ref_name }}-portable.zip
            dist/installer/*.exe
          if-no-files-found: error

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/SouthParkDownloader-${{ github.ref_name }}-portable.zip
            dist/installer/*.exe
