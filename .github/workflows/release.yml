name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  windows:
    name: Windows release
    runs-on: windows-latest

    steps:
      # ------------------------------------------------------------
      # Checkout
      # ------------------------------------------------------------
      - name: Check out repository
        uses: actions/checkout@v4

      # ------------------------------------------------------------
      # Python
      # ------------------------------------------------------------
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      # ------------------------------------------------------------
      # Dependencies
      # ------------------------------------------------------------
      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest pyinstaller

      # ------------------------------------------------------------
      # Tests
      # ------------------------------------------------------------
      - name: Run tests
        shell: pwsh
        run: |
          python -m pytest -q

      # ------------------------------------------------------------
      # Clean previous build directories
      # ------------------------------------------------------------
      - name: Clean build directories
        shell: pwsh
        run: |
          if (Test-Path "build") {
            Remove-Item "build" -Recurse -Force
          }

          if (Test-Path "dist") {
            Remove-Item "dist" -Recurse -Force
          }

          New-Item -ItemType Directory -Path "dist" -Force | Out-Null

      # ------------------------------------------------------------
      # Build application with PyInstaller
      # ------------------------------------------------------------
      - name: Build application
        shell: pwsh
        run: |
          python -m PyInstaller `
            --clean `
            --noconfirm `
            --distpath "dist" `
            packaging\SouthParkDownloader.spec

      # ------------------------------------------------------------
      # Verify PyInstaller output
      # ------------------------------------------------------------
      - name: Verify PyInstaller output
        shell: pwsh
        run: |
          $exe = "dist\SouthParkDownloader.exe"

          Write-Host ""
          Write-Host "========== PYINSTALLER OUTPUT =========="
          Write-Host ""

          if (-not (Test-Path -LiteralPath $exe)) {
            Write-Host "Expected executable was not found:"
            Write-Host $exe
            Write-Host ""
            Write-Host "Actual dist contents:"
            Get-ChildItem "dist" -Recurse |
              Select-Object FullName, Length |
              Format-Table -AutoSize

            throw "PyInstaller did not produce dist\SouthParkDownloader.exe."
          }

          $file = Get-Item $exe

          Write-Host "PyInstaller build successful."
          Write-Host "Executable: $($file.FullName)"
          Write-Host "Size: $($file.Length) bytes"

          Write-Host ""
          Write-Host "========================================="

      # ------------------------------------------------------------
      # Prepare installer input
      #
      # PyInstaller produces:
      #
      # dist\
      #   SouthParkDownloader.exe
      #
      # Inno Setup expects:
      #
      # dist\
      #   SouthParkDownloader\
      #       SouthParkDownloader.exe
      #
      # So we create that directory and copy ONLY the executable.
      # ------------------------------------------------------------
      - name: Prepare installer input
        shell: pwsh
        run: |
          $source = "dist\SouthParkDownloader.exe"
          $targetDir = "dist\SouthParkDownloader"
          $target = Join-Path $targetDir "SouthParkDownloader.exe"

          if (-not (Test-Path -LiteralPath $source)) {
            throw "Source executable does not exist: $source"
          }

          if (Test-Path -LiteralPath $targetDir) {
            Remove-Item $targetDir -Recurse -Force
          }

          New-Item `
            -ItemType Directory `
            -Path $targetDir `
            -Force |
            Out-Null

          Copy-Item `
            -LiteralPath $source `
            -Destination $target `
            -Force

          if (-not (Test-Path -LiteralPath $target)) {
            throw "Failed to prepare installer input."
          }

          Write-Host ""
          Write-Host "========== INSTALLER INPUT =========="
          Write-Host ""

          Get-ChildItem $targetDir -Recurse |
            Select-Object FullName, Length |
            Format-Table -AutoSize

          Write-Host ""
          Write-Host "Installer input prepared successfully."
          Write-Host "====================================="

      # ------------------------------------------------------------
      # Install Inno Setup
      # ------------------------------------------------------------
      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup --no-progress --yes

          $possiblePaths = @(
            "$env:ProgramFiles(x86)\Inno Setup 6\ISCC.exe",
            "$env:ProgramFiles\Inno Setup 6\ISCC.exe"
          )

          $iscc = $possiblePaths |
            Where-Object {
              Test-Path -LiteralPath $_
            } |
            Select-Object -First 1

          if (-not $iscc) {
            Write-Host ""
            Write-Host "Inno Setup could not be located."
            Write-Host ""

            Write-Host "Searching Program Files..."
            
            Get-ChildItem "C:\Program Files (x86)" `
              -Directory `
              -ErrorAction SilentlyContinue |
              Where-Object {
                $_.Name -like "*Inno*"
              } |
              Select-Object FullName

            Get-ChildItem "C:\Program Files" `
              -Directory `
              -ErrorAction SilentlyContinue |
              Where-Object {
                $_.Name -like "*Inno*"
              } |
              Select-Object FullName

            throw "Inno Setup 6 was not found after installation."
          }

          Write-Host ""
          Write-Host "Inno Setup found:"
          Write-Host $iscc
          Write-Host ""

          "ISCC_PATH=$iscc" |
            Out-File `
              -FilePath $env:GITHUB_ENV `
              -Encoding utf8 `
              -Append

      # ------------------------------------------------------------
      # Build installer
      # ------------------------------------------------------------
      - name: Build installer
        shell: pwsh
        run: |
          if (-not $env:ISCC_PATH) {
            throw "ISCC_PATH was not set."
          }

          if (-not (Test-Path -LiteralPath $env:ISCC_PATH)) {
            throw "ISCC.exe does not exist at: $env:ISCC_PATH"
          }

          if (-not (Test-Path -LiteralPath "dist\SouthParkDownloader")) {
            throw "Installer input directory does not exist."
          }

          Write-Host ""
          Write-Host "========== BUILDING INSTALLER =========="
          Write-Host ""
          Write-Host "Inno Setup:"
          Write-Host $env:ISCC_PATH
          Write-Host ""

          & $env:ISCC_PATH "packaging\SouthParkDownloader.iss"

          if ($LASTEXITCODE -ne 0) {
            throw "Inno Setup failed with exit code $LASTEXITCODE."
          }

          Write-Host ""
          Write-Host "Inno Setup completed successfully."
          Write-Host "========================================="

      # ------------------------------------------------------------
      # Verify installer
      # ------------------------------------------------------------
      - name: Verify installer
        shell: pwsh
        run: |
          $installerDir = "dist\installer"

          if (-not (Test-Path -LiteralPath $installerDir)) {
            throw "Installer directory was not created: $installerDir"
          }

          $installer = Get-ChildItem `
            $installerDir `
            -Filter "*.exe" `
            -File |
            Select-Object -First 1

          if (-not $installer) {
            throw "No installer executable was created."
          }

          Write-Host ""
          Write-Host "========== INSTALLER VERIFIED =========="
          Write-Host ""
          Write-Host "File:"
          Write-Host $installer.FullName
          Write-Host ""
          Write-Host "Size:"
          Write-Host "$($installer.Length) bytes"
          Write-Host ""
          Write-Host "========================================="

      # ------------------------------------------------------------
      # Create portable ZIP
      # ------------------------------------------------------------
      - name: Create portable ZIP
        shell: pwsh
        run: |
          $zip = "dist\SouthParkDownloader-${{ github.ref_name }}-portable.zip"

          if (Test-Path -LiteralPath $zip) {
            Remove-Item $zip -Force
          }

          Compress-Archive `
            -Path "dist\SouthParkDownloader\*" `
            -DestinationPath $zip `
            -CompressionLevel Optimal

          if (-not (Test-Path -LiteralPath $zip)) {
            throw "Portable ZIP was not created."
          }

          $zipFile = Get-Item $zip

          Write-Host ""
          Write-Host "Portable ZIP created:"
          Write-Host $zipFile.FullName
          Write-Host "Size: $($zipFile.Length) bytes"

      # ------------------------------------------------------------
      # Upload artifacts
      # ------------------------------------------------------------
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: southpark-downloader-windows-${{ github.ref_name }}
          path: |
            dist/SouthParkDownloader-${{ github.ref_name }}-portable.zip
            dist/installer/*.exe
          if-no-files-found: error

      # ------------------------------------------------------------
      # Create GitHub Release
      # ------------------------------------------------------------
      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/SouthParkDownloader-${{ github.ref_name }}-portable.zip
            dist/installer/*.exe