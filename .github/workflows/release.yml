name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  windows:
    name: Windows release
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest pyinstaller

      - name: Run tests
        shell: pwsh
        run: |
          python -m pytest -q

      - name: Build portable application
        shell: pwsh
        run: |
          python -m PyInstaller --clean --noconfirm packaging\SouthParkDownloader.spec

      - name: Locate Inno Setup
        shell: pwsh
        run: |
          Write-Host "Searching for Inno Setup..."

          $candidates = @(
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
            "${env:ProgramFiles}\Inno Setup 6\ISCC.exe",
            "${env:LOCALAPPDATA}\Programs\Inno Setup 6\ISCC.exe",
            "C:\Program Files (x86)\Inno Setup 6\ISCC.exe",
            "C:\Program Files\Inno Setup 6\ISCC.exe"
          )

          $iscc = $candidates |
            Where-Object { Test-Path -LiteralPath $_ } |
            Select-Object -First 1

          if (-not $iscc) {
            Write-Host "Known locations did not contain ISCC.exe."
            Write-Host ""
            Write-Host "Searching the runner filesystem..."

            $iscc = Get-ChildItem `
              -Path "C:\Program Files", "C:\Program Files (x86)", "$env:LOCALAPPDATA" `
              -Filter "ISCC.exe" `
              -Recurse `
              -ErrorAction SilentlyContinue |
              Select-Object -First 1 -ExpandProperty FullName
          }

          if (-not $iscc) {
            Write-Host ""
            Write-Host "PATH:"
            Write-Host $env:PATH

            Write-Host ""
            Write-Host "Chocolatey Inno Setup directory:"
            if (Test-Path "C:\ProgramData\chocolatey\lib\InnoSetup") {
              Get-ChildItem "C:\ProgramData\chocolatey\lib\InnoSetup" -Recurse |
                Select-Object -ExpandProperty FullName
            }

            throw "ISCC.exe could not be found on the Windows runner."
          }

          Write-Host ""
          Write-Host "========================================"
          Write-Host "Inno Setup found:"
          Write-Host $iscc
          Write-Host "========================================"

          "ISCC_PATH=$iscc" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8

      - name: Build installer
        shell: pwsh
        run: |
          if (-not $env:ISCC_PATH) {
            throw "ISCC_PATH was not set."
          }

          if (-not (Test-Path -LiteralPath $env:ISCC_PATH)) {
            throw "ISCC.exe does not exist at: $env:ISCC_PATH"
          }

          Write-Host "Building installer with:"
          Write-Host $env:ISCC_PATH

          & $env:ISCC_PATH "packaging\SouthParkDownloader.iss"

          if ($LASTEXITCODE -ne 0) {
            throw "Inno Setup failed with exit code $LASTEXITCODE."
          }

      - name: Verify installer
        shell: pwsh
        run: |
          $installer = Get-ChildItem "dist\installer\*.exe" -ErrorAction SilentlyContinue |
            Select-Object -First 1

          if (-not $installer) {
            Write-Host "Contents of dist:"
            if (Test-Path "dist") {
              Get-ChildItem "dist" -Recurse |
                Select-Object FullName
            }

            throw "Installer was not created in dist\installer."
          }

          Write-Host "========================================"
          Write-Host "Installer created successfully"
          Write-Host "File: $($installer.FullName)"
          Write-Host "Size: $($installer.Length) bytes"
          Write-Host "========================================"

      - name: Zip portable build
        shell: pwsh
        run: |
          Compress-Archive `
            -Path "dist\SouthParkDownloader\*" `
            -DestinationPath "dist\SouthParkDownloader-${{ github.ref_name }}-portable.zip"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: southpark-downloader-windows
          path: |
            dist/SouthParkDownloader-${{ github.ref_name }}-portable.zip
            dist/installer/*.exe
          if-no-files-found: error

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/SouthParkDownloader-${{ github.ref_name }}-portable.zip
            dist/installer/*.exe